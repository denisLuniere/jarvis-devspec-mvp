[project]
name = "jarvis-devspec-mvp"
version = "0.4.0"
description = "Jarvis local com desenvolvimento orientado por especificações"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.34.0"]
voice = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.14",
]
all = [
    "openai>=1.0.0",
    "anthropic>=0.34.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.14",
]

[project.scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.packages.find]
where = ["src"]
